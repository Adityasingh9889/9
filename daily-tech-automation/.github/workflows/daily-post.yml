name: Daily Tech Post

on:
  schedule:
    - cron: "30 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate meaningful post
        run: python daily-tech-automation/poster.py

      - name: Commit only if something was published
        run: |
          if git diff --quiet; then
            echo "Nothing meaningful to publish today."
            exit 0
          fi
          git config user.name "daily-tech-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add daily-tech-automation/
          git commit -m "chore: publish daily tech note"
          git push
